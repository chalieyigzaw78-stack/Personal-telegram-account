# fly.toml app configuration file generated for personal-telegram-account on 2026-11-15T14:16:52Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'personal-telegram-account'
primary_region = 'cdg'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
